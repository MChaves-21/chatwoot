# Esteira do Chatwoot da Goncalves & Silva: verificar -> buildar -> implantar.
#
# Diferencas em relacao aos workflows do upstream:
#   - publica no GHCR usando o GITHUB_TOKEN, entao nao ha secret para configurar;
#   - so linux/amd64 (o VPS do Easypanel e amd64) — corta o tempo pela metade;
#   - edicao "ee", igual a imagem chatwoot/chatwoot:latest que a instancia ja usa.
#     Trocar para "ce" mudaria os recursos disponiveis.
#
# A verificacao roda ANTES e o build depende dela (`needs`). Um JSON de traducao
# quebrado derruba o dashboard em tela branca e passa batido pelo build Docker;
# barrar em 2 minutos e melhor que descobrir em producao.
#
# Em pull request, so verifica. Publicar imagem e so no push da goncalves-main.

name: Chatwoot (Goncalves & Silva)

on:
  push:
    branches:
      - goncalves-main
  pull_request:
    branches:
      - goncalves-main
  workflow_dispatch:

# Dois pushes seguidos na goncalves-main disparavam duas esteiras que corriam
# juntas: as duas empurravam a tag :goncalves e as duas chamavam o webhook de
# deploy, sem ordem garantida — dava para o Easypanel subir a imagem do commit
# ANTERIOR. Agora so uma esteira por branch corre por vez. Em pull request a
# anterior e cancelada (ninguem espera build de commit ja substituido); no push
# a anterior termina, porque cancelar no meio do deploy e pior que esperar.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/chatwoot

permissions:
  contents: read
  packages: write

jobs:
  verificar:
    name: Verificar
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node da versao do projeto
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      # Instala so o compilador de SFC. Um `pnpm install` completo levaria
      # minutos e traria 2 mil pacotes que nenhuma destas checagens usa.
      #
      # A instalacao acontece FORA do repositorio: o package.json do Chatwoot
      # tem conflito de peer deps, e `npm install` dentro dele quebra com
      # ERESOLVE mesmo com --no-save. Depois o node_modules e ligado por
      # symlink na raiz, porque import de ESM ignora NODE_PATH.
      - name: Instalar o compilador de .vue (fora do repo)
        run: |
          mkdir -p "$RUNNER_TEMP/sfc"
          cd "$RUNNER_TEMP/sfc"
          npm init -y > /dev/null
          npm install --no-audit --no-fund @vue/compiler-sfc@3.5.13

      - name: Verificacoes do fork
        run: |
          ln -sfn "$RUNNER_TEMP/sfc/node_modules" node_modules
          node .github/scripts/verificar-goncalves.mjs

  build:
    name: Build e publicacao
    needs: verificar
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.nome.outputs.image }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Definir edicao (ee, igual ao chatwoot/chatwoot:latest)
        run: echo -en '\nENV CW_EDITION="ee"' >> docker/Dockerfile

      - name: Nome da imagem em minusculas
        id: nome
        run: |
          NOME=$(echo '${{ env.IMAGE }}' | tr '[:upper:]' '[:lower:]')
          echo "IMAGE=$NOME" >> $GITHUB_ENV
          echo "image=$NOME" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login no GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build e push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64
          push: true
          # Duas tags: "goncalves" para o Easypanel apontar e ficar fixo,
          # e o sha do commit para dar rollback exato quando precisar.
          tags: |
            ${{ env.IMAGE }}:goncalves
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Resumo
        run: |
          {
            echo "### Imagem publicada"
            echo ""
            echo '```'
            echo "${{ env.IMAGE }}:goncalves"
            echo "${{ env.IMAGE }}:${{ github.sha }}"
            echo '```'
            echo ""
            echo "Rollback: aponte o Easypanel para a tag do sha anterior."
          } >> $GITHUB_STEP_SUMMARY

  implantar:
    name: Implantar no Easypanel
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      # O deploy so acontece se o segredo EASYPANEL_DEPLOY_HOOK existir. Sem
      # ele o job passa avisando, em vez de falhar — assim quem ainda nao
      # configurou continua com o build funcionando e implanta na mao.
      - name: Chamar o webhook de deploy
        env:
          HOOK: ${{ secrets.EASYPANEL_DEPLOY_HOOK }}
        run: |
          if [ -z "$HOOK" ]; then
            echo "Segredo EASYPANEL_DEPLOY_HOOK nao configurado."
            echo "A imagem ${{ needs.build.outputs.image }}:goncalves esta publicada;"
            echo "clique em Deploy no Easypanel para puxa-la."
            {
              echo "### Deploy manual necessario"
              echo ""
              echo "Configure o segredo \`EASYPANEL_DEPLOY_HOOK\` para automatizar."
            } >> $GITHUB_STEP_SUMMARY
            exit 0
          fi

          # Sem --max-time o curl fica pendurado ate o teto de 6h do runner se o
          # Easypanel parar de responder no meio da conexao. O --retry cobre o
          # caso comum de o painel estar reiniciando na hora do disparo; POST de
          # deploy hook e idempotente, repetir so encurta a fila.
          CODIGO=$(curl -sS -X POST "$HOOK" \
            --connect-timeout 15 \
            --max-time 60 \
            --retry 2 \
            --retry-delay 5 \
            --retry-connrefused \
            -o /tmp/resposta.txt -w '%{http_code}') || CODIGO=000
          echo "HTTP $CODIGO"
          cat /tmp/resposta.txt || true

          if [ "$CODIGO" = "000" ]; then
            echo "Nao foi possivel falar com o Easypanel (timeout ou conexao recusada)."
            echo "A imagem esta publicada; implante na mao."
            exit 1
          fi

          if [ "$CODIGO" -lt 200 ] || [ "$CODIGO" -ge 300 ]; then
            echo "O Easypanel recusou o deploy. A imagem esta publicada; implante na mao."
            exit 1
          fi

          {
            echo "### Deploy disparado"
            echo ""
            echo "\`${{ needs.build.outputs.image }}:${{ github.sha }}\`"
          } >> $GITHUB_STEP_SUMMARY
